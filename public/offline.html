<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111A22">
  <title>Sem conexão · EntregaOS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111a22;color:#f4f8fc;font-family:Inter,system-ui,-apple-system,sans-serif}
    main{width:min(100%,440px);padding:36px;border:1px solid #29404e;border-radius:24px;background:#1a2934;text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border-radius:18px;background:#35d9f5;color:#111a22;font-size:28px;font-weight:900}
    h1{margin:0 0 12px;font-size:27px}p{color:#b8c8d2;line-height:1.65}
    button{margin-top:14px;border:0;border-radius:12px;padding:13px 18px;background:#35d9f5;color:#111a22;font-weight:800;font-size:15px}
  </style>
</head>
<body><main><div class="mark">E</div><h1>Você está sem conexão</h1><p>O EntregaOS precisa de internet para carregar pedidos e atualizar entregas. Verifique sua conexão e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
